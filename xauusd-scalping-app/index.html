<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAUUSD Scalping Signals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- TradingView Widget -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body class="bg-gray-900 text-white font-['Inter']">
    <div class="container mx-auto px-4 py-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold mb-2">XAUUSD Scalping Signals</h1>
            <p class="text-gray-400">1-Minute Timeframe Trading Signals</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <!-- TradingView Chart -->
            <div class="bg-gray-800 rounded-lg p-4">
                <h2 class="text-xl font-semibold mb-4">Live XAUUSD Chart</h2>
                <div id="tradingview_widget" class="w-full" style="height: 400px;"></div>
            </div>

            <!-- Signal Panel -->
            <div class="bg-gray-800 rounded-lg p-4">
                <h2 class="text-xl font-semibold mb-4">Latest Signals</h2>
                <div id="signalsList" class="space-y-4">
                    <!-- Signals will be inserted here -->
                </div>
            </div>
        </div>

        <!-- Strategy Info -->
        <div class="bg-gray-800 rounded-lg p-6">
            <h2 class="text-xl font-semibold mb-4">Strategy Information</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-gray-700 rounded-lg p-4">
                    <h3 class="text-lg font-medium mb-2">Win Rate</h3>
                    <p class="text-2xl font-bold text-green-400">75%</p>
                </div>
                <div class="bg-gray-700 rounded-lg p-4">
                    <h3 class="text-lg font-medium mb-2">Total Signals</h3>
                    <p class="text-2xl font-bold text-blue-400">0</p>
                </div>
                <div class="bg-gray-700 rounded-lg p-4">
                    <h3 class="text-lg font-medium mb-2">Last Signal</h3>
                    <p class="text-2xl font-bold text-yellow-400">--</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
